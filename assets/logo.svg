<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120" fill="none">
  <defs>
    <!-- Import 'Syne' (an ultra-cool, wide, modern font) and 'Space Mono' -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&amp;family=Syne:wght@700;800&amp;display=swap');
      
      .brand-title {
        font-family: 'Syne', -apple-system, sans-serif;
        font-size: 38px;
        font-weight: 800;
        fill: url(#cyan-magenta-grad);
        letter-spacing: -0.01em;
      }
      .brand-subtitle {
        font-family: 'Space Mono', monospace;
        font-size: 9px;
        font-weight: 700;
        fill: #475569;
        letter-spacing: 0.4em;
      }
      .divider {
        stroke: url(#cyan-magenta-grad);
        stroke-width: 2;
        stroke-linecap: round;
        opacity: 0.8;
      }
      
      /* Isometric Slices styling */
      .slice-edge {
        stroke: url(#cyan-magenta-grad);
        stroke-width: 1.5;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .noise-dot {
        fill: #00f2fe;
      }
      .mid-dot {
        fill: #8b5cf6;
      }
      .clean-dot {
        fill: #d946ef;
      }

      /* Light Mode overrides */
      @media (prefers-color-scheme: light) {
        .brand-subtitle { fill: #64748b; }
      }
    </style>

    <!-- Glowing cyan-to-magenta gradient running horizontally -->
    <linearGradient id="cyan-magenta-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f2fe" />   <!-- Pure Neon Cyan -->
      <stop offset="100%" style="stop-color:#d946ef" /> <!-- Pure Neon Magenta -->
    </linearGradient>
    
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ── ICON: Sliced Denoising Tri-Planes (Centred around 60, 60) ── -->
  <!-- This represents 3 offset slices transitioning from noisy diffusion to structured density -->
  <g transform="translate(60, 60)" filter="url(#neon-glow)">
    
    <!-- SLICE 1 (Top / Noisy / Diffuse Plane) -->
    <g transform="translate(0, -22)">
      <polygon points="0,-12 24,-2 0,8 -24,-2" class="slice-edge" stroke-dasharray="2 3" opacity="0.4" />
      <!-- Noisy, scattered atoms -->
      <circle cx="-10" cy="-4" r="1.5" class="noise-dot" opacity="0.7"/>
      <circle cx="8" cy="-6" r="1.5" class="noise-dot" opacity="0.7"/>
      <circle cx="2" cy="2" r="1" class="noise-dot" opacity="0.5"/>
      <circle cx="-14" cy="0" r="1" class="noise-dot" opacity="0.5"/>
    </g>

    <!-- SLICE 2 (Middle / Semi-Structured Plane) -->
    <g transform="translate(0, 0)">
      <polygon points="0,-12 24,-2 0,8 -24,-2" class="slice-edge" stroke-dasharray="5 2" opacity="0.7" />
      <!-- Aligning structure (blended purple/indigo) -->
      <path d="M-12,0 C-4,-6 4,-6 12,0" stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.8" />
      <circle cx="-12" cy="0" r="2.5" class="mid-dot" />
      <circle cx="12" cy="0" r="2.5" class="mid-dot" />
    </g>

    <!-- SLICE 3 (Bottom / Fully Denoised & Reconstructed Plane) -->
    <g transform="translate(0, 22)">
      <polygon points="0,-12 24,-2 0,8 -24,-2" class="slice-edge" fill="url(#cyan-magenta-grad)" fill-opacity="0.08" />
      <!-- Solid molecular backbone and clean atoms -->
      <path d="M-16,-2 Q0,8 16,-2" stroke="url(#cyan-magenta-grad)" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <circle cx="-16" cy="-2" r="4.5" fill="url(#cyan-magenta-grad)" />
      <circle cx="0" cy="3" r="3.5" class="clean-dot" />
      <circle cx="16" cy="-2" r="4.5" fill="url(#cyan-magenta-grad)" />
    </g>

    <!-- Connecting vertical projection lines showing cross-plane alignment -->
    <line x1="-12" y1="-22" x2="-12" y2="0" stroke="#8b5cf6" stroke-width="0.8" stroke-dasharray="1 3" opacity="0.5" />
    <line x1="12" y1="-22" x2="12" y2="0" stroke="#8b5cf6" stroke-width="0.8" stroke-dasharray="1 3" opacity="0.5" />
    <line x1="-16" y1="0" x2="-16" y2="20" stroke="#d946ef" stroke-width="0.8" stroke-dasharray="1 3" opacity="0.5" />
    <line x1="16" y1="0" x2="16" y2="20" stroke="#d946ef" stroke-width="0.8" stroke-dasharray="1 3" opacity="0.5" />
  </g>

  <!-- ── TYPOGRAPHY LOCKUP ── -->
  <!-- Glowing Divider Line -->
  <line x1="120" y1="28" x2="120" y2="92" class="divider" />

  <!-- Wordmark using Syne (gorgeous wide letterforms) -->
  <g transform="translate(140, 58)">
    <text class="brand-title">FrostByte</text>
  </g>
  
  <!-- Subtitle Tagline using Space Mono -->
  <g transform="translate(140, 84)">
    <text class="brand-subtitle">SE(3)-EQUIVARIANT DIFFUSION PRIOR</text>
  </g>
</svg>
